<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-3">
    <a routerLink="/tasks" class="text-lg font-semibold text-slate-900">Task Manager</a>
    <nav class="flex items-center gap-4 text-sm">
      <a
        routerLink="/tasks"
        routerLinkActive="font-semibold text-indigo-700"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-slate-600 hover:text-slate-900"
        >Tasks</a
      >
      <a
        routerLink="/tasks/new"
        class="rounded-md bg-indigo-600 px-3 py-1.5 font-medium text-white hover:bg-indigo-700"
        >New task</a
      >
    </nav>
  </div>
</header>

<main class="mx-auto max-w-4xl px-4 py-6">
  <router-outlet />
</main>

<app-toast-container />
