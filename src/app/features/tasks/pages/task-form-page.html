<section class="mx-auto max-w-2xl">
  <h1 class="mb-4 text-xl font-semibold text-slate-900">
    {{ isEdit() ? 'Edit task' : 'New task' }}
  </h1>

  @if (isEdit() && !store.loaded()) {
    @if (store.error(); as message) {
      <div class="rounded-lg border border-red-200 bg-red-50 p-5 text-center" role="alert">
        <p class="text-red-900">{{ message }}</p>
        <button
          type="button"
          class="mt-3 rounded-md bg-red-600 px-3 py-1.5 text-sm font-medium text-white"
          (click)="store.load(true)"
        >
          Try again
        </button>
      </div>
    } @else {
      <app-loading-spinner label="Loading task…" />
    }
  } @else if (notFound()) {
    <div class="rounded-lg border border-slate-200 bg-white p-6 text-center">
      <p class="font-medium text-slate-900">We couldn't find that task.</p>
      <a routerLink="/tasks" class="mt-2 inline-block text-indigo-700 underline">Back to tasks</a>
    </div>
  } @else {
    <div class="rounded-lg border border-slate-200 bg-white p-5">
      <app-task-form
        [task]="task()"
        [saving]="store.saving()"
        (submitted)="save($event)"
        (cancelled)="goBack()"
      />
    </div>
  }
</section>
